spring:
  datasource:
    url: jdbc:h2:mem:token;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      jakarta.persistence.lock.timeout: 10000
  cloud:
    discovery:
      enabled: false
  kafka:
    listener:
      auto-startup: false
    admin:
      fail-fast: false
      auto-create: false

eureka:
  client:
    enabled: false

management:
  health:
    kafka:
      enabled: false

token:
  kafka:
    consumer-enabled: false
  outbox:
    enabled: false

portone:
  stub-enabled: true
