spring:
  application:
    name: planwith-fo-token
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[spring.json.add.type.headers]": false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:token-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      auto-startup: ${TOKEN_KAFKA_CONSUMER_ENABLED:true}

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8084}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    serviceUrl:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://discovery:8761/eureka/}"
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    kafka:
      enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html

app:
  gateway:
    public-url: ${GATEWAY_PUBLIC_URL:/}
  # auth:
  #   id: ${LOGIN_ID:test-001}
  #   pw: ${LOGIN_PASSWORD:1234}
  deploy:
    marker: ${DEPLOY_MARKER:planwith-fo-token-deploy-v1}

token:
  gateway-auth:
    enabled: ${TOKEN_GATEWAY_AUTH_ENABLED:true}
  kafka:
    consumer-enabled: ${TOKEN_KAFKA_CONSUMER_ENABLED:true}
    topics:
      payment-completed: ${TOKEN_TOPIC_PAYMENT_COMPLETED:planwith.payment.completed}
      grade-reward-granted: ${TOKEN_TOPIC_GRADE_REWARD_GRANTED:planwith.grade.reward-granted}
      grade-initial-bonus-granted: ${TOKEN_TOPIC_GRADE_INITIAL_BONUS_GRANTED:planwith.grade.initial-bonus-granted}
      token-charged: ${TOKEN_TOPIC_TOKEN_CHARGED:planwith.token.charged}
      token-used: ${TOKEN_TOPIC_TOKEN_USED:planwith.token.used}
      token-rewarded: ${TOKEN_TOPIC_TOKEN_REWARDED:planwith.token.rewarded}
      token-expired: ${TOKEN_TOPIC_TOKEN_EXPIRED:planwith.token.expired}
      token-charge-failed: ${TOKEN_TOPIC_TOKEN_CHARGE_FAILED:planwith.token.charge-failed}
  outbox:
    enabled: ${TOKEN_OUTBOX_ENABLED:true}
    relay-batch-size: ${TOKEN_OUTBOX_RELAY_BATCH_SIZE:50}
    relay-interval: ${TOKEN_OUTBOX_RELAY_INTERVAL:5s}
    relay-initial-delay: ${TOKEN_OUTBOX_RELAY_INITIAL_DELAY:5s}
    send-timeout: ${TOKEN_OUTBOX_SEND_TIMEOUT:10s}
    max-retry: ${TOKEN_OUTBOX_MAX_RETRY:10}
    backoff-initial: ${TOKEN_OUTBOX_BACKOFF_INITIAL:5s}
    backoff-multiplier: ${TOKEN_OUTBOX_BACKOFF_MULTIPLIER:2}
    backoff-max: ${TOKEN_OUTBOX_BACKOFF_MAX:5m}
  # mock:
  #   enabled: ${TOKEN_MOCK_ENABLED:true}
  #   member-uuid: ${TOKEN_MOCK_MEMBER_UUID:aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa}
  charge:
    reconcile:
      enabled: ${TOKEN_CHARGE_RECONCILE_ENABLED:true}
      batch-size: ${TOKEN_CHARGE_RECONCILE_BATCH_SIZE:50}
      stale-after: ${TOKEN_CHARGE_RECONCILE_STALE_AFTER:5m}
      interval: ${TOKEN_CHARGE_RECONCILE_INTERVAL:1m}
      initial-delay: ${TOKEN_CHARGE_RECONCILE_INITIAL_DELAY:30s}
      max-retry: ${TOKEN_CHARGE_RECONCILE_MAX_RETRY:10}

portone:
  stub-enabled: ${PORTONE_STUB_ENABLED:true}
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}
  api-secret: ${PORTONE_API_SECRET:}
  api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
