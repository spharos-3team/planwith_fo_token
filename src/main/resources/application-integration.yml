spring:
  config:
    activate:
      on-profile: integration
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/token_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:token_user}
    password: ${DB_PASSWORD:token_pass}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${TOKEN_KAFKA_CONSUMER_ENABLED:false}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8084}

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

token:
  gateway-auth:
    enabled: true
  kafka:
    consumer-enabled: ${TOKEN_KAFKA_CONSUMER_ENABLED:false}
  outbox:
    enabled: ${TOKEN_OUTBOX_ENABLED:false}
  mock:
    enabled: false

portone:
  stub-enabled: ${PORTONE_STUB_ENABLED:true}
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}
  api-secret: ${PORTONE_API_SECRET:}
